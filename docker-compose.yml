# Convenience wrapper around docker/Dockerfile.
#
#   docker compose run --rm check      # R CMD check inside the container
#   docker compose run --rm analysis   # regenerate results, figures and paper
services:
  check:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: rdsc:latest
    command: make check

  analysis:
    image: rdsc:latest
    volumes:
      - ./analysis:/project/analysis
    command: make analysis
