# Measure test coverage with covr and publish it in the job summary.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          pct <- covr::percent_coverage(cov)
          cat(sprintf("Total coverage: %.1f%%\n", pct))
          files <- covr::coverage_to_list(cov)$filecoverage
          summary_md <- c(
            sprintf("## Test coverage: %.1f%%", pct), "",
            "| File | Coverage |", "|---|---|",
            sprintf("| `%s` | %.1f%% |", names(files), files)
          )
          cat(summary_md, sep = "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
        shell: Rscript {0}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
