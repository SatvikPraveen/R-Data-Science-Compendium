# Run every tutorial module, render the case studies and initialise the Shiny
# apps (modules/check-modules.R). Scheduled weekly as well, because this code
# depends on ~150 CRAN packages whose updates can break it.
on:
  push:
    branches: [main]
    paths: ["modules/**", "shiny-apps/**", ".github/workflows/modules.yaml"]
  pull_request:
    paths: ["modules/**", "shiny-apps/**", ".github/workflows/modules.yaml"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

name: modules

permissions: read-all

jobs:
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pak
        run: |
          install.packages("pak", repos = sprintf(
            "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
            .Platform$pkgType, R.Version()$os, R.Version()$arch))
        shell: Rscript {0}

      - name: Cache the R library
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: modules-${{ runner.os }}-r-${{ hashFiles('modules/**/*.R', 'modules/**/*.Rmd', 'shiny-apps/**/*.R') }}
          restore-keys: modules-${{ runner.os }}-r-

      # pak installs binaries from Posit Package Manager and resolves the
      # Ubuntu system libraries they need (it can use sudo on the runner).
      - name: Install module dependencies
        timeout-minutes: 60
        run: |
          pkgs <- system2("Rscript", c("modules/install-dependencies.R", "--list"), stdout = TRUE)
          cran <- rownames(available.packages())
          skipped <- setdiff(pkgs, cran)
          if (length(skipped)) message("Not on CRAN (skipped): ", paste(skipped, collapse = ", "))
          # Leave already-installed packages (including R's recommended
          # packages such as MASS or boot) alone; asking pak to reinstall
          # them causes dependency conflicts.
          todo <- setdiff(intersect(pkgs, cran), rownames(installed.packages()))
          message("Installing ", length(todo), " packages")
          if (length(todo)) pak::pkg_install(todo, upgrade = FALSE, ask = FALSE)
          # Packages restored from the cache skip pak's install step, so their
          # Ubuntu system libraries (e.g. libglpk for igraph) are not on a fresh
          # runner. Install any that are missing for the whole library.
          pak::sysreqs_fix_installed()
        shell: Rscript {0}

      - name: Run modules, case studies and apps
        timeout-minutes: 45
        run: Rscript modules/check-modules.R
