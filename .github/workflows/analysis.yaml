# Smoke-test the research-compendium pipeline: run both simulation studies
# with a handful of replicates, redraw the figures and render the paper.
# The committed full-size results are restored afterwards and never changed.
on:
  push:
    branches: [main]
    paths: ["R/**", "analysis/**", "DESCRIPTION", "Makefile", ".github/workflows/analysis.yaml"]
  pull_request:
    paths: ["R/**", "analysis/**", "DESCRIPTION", "Makefile", ".github/workflows/analysis.yaml"]
  workflow_dispatch:

name: analysis

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RDSC_WORKERS: 2
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::., any::future.apply, any::rprojroot, any::rmarkdown

      - name: Run the pipeline with few replicates
        run: make analysis-quick

      - name: Render the paper from the quick results
        run: make paper

      - name: Restore committed results
        run: git checkout -- analysis/
